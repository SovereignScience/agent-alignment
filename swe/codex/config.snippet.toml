# Codex CLI: the settings this track runs with. Merge into ~/.codex/config.toml
# and put default.rules at ~/.codex/rules/default.rules. The profile is the
# sandbox boundary; default.rules forbids irreversible and outward commands
# in every mode. Codex expands ~ in paths.

approval_policy = "never"
default_permissions = "alignment_workstation"
web_search = "live"
check_for_update_on_startup = false

[history]
persistence = "none"

[analytics]
enabled = false

[feedback]
enabled = false

[memories]
use_memories = false
generate_memories = false

[features]
memories = false
chronicle = false

# install_isolation.sh writes this profile body into /etc/codex/requirements.toml
# as alignment_workstation, the only profile Codex may run. It does not need to
# be in ~/.codex/config.toml.
[permissions.workstation]
extends = ":workspace"

[permissions.workstation.filesystem]
# Deny-read globs below are expanded to a list of matching files before each
# sandboxed process starts, on platforms that snapshot matches, down to this
# depth. A deeper file, or one created while a process runs, is not covered
# until the next process starts. Raise the depth if your checkouts nest
# deeper; check enforcement on your client with throwaway sentinel files.
glob_scan_max_depth = 8
# Reads are denied everywhere by default and reopened only where commands
# need them, as in the documented workspace-only profile; the workspace roots
# stay writable. The named denials below stay as a second layer.
":root" = "deny"
":minimal" = "read"
"/etc" = "read"
"/usr/local" = "read"
"/opt/lattice" = "read"
"~/.gitconfig" = "read"
"~/.config/git" = "read"
"~/.ssh" = "deny"
"~/.kube" = "deny"
"~/.config/gh" = "deny"
"~/.config/age" = "deny"
"~/.gnupg" = "deny"
"~/.password-store" = "deny"
"~/.docker/config.json" = "deny"
"~/.codex/auth.json" = "deny"
"~/.claude/.credentials.json" = "deny"
# Recommended with network on: every allowed host becomes a write target, so
# keep every credential store unreadable.
"~/.npmrc" = "deny"
"~/.pypirc" = "deny"
"~/.git-credentials" = "deny"
"~/.aws" = "deny"
"~/.netrc" = "deny"
"~/.config/gcloud" = "deny"
"~/.config/b2" = "deny"
"~/.config/doctl" = "deny"
"~/.cargo/credentials.toml" = "deny"
"~/.cargo/credentials" = "deny"
"~/.config/git/credentials" = "deny"
"~/.config/helm" = "deny"
"~/.config/pinniped" = "deny"
"~/.gsutil" = "deny"
# Sessions, shell history, browser profiles and tool tokens. Claude Code hides
# all of ~/ by default; Codex profiles take exact paths, so these are named.
# ~/.config/agent-alignment holds the local file and check_isolation.sh's
# sentinel, which must stay unreadable.
"/mnt/c" = "deny"
"~/.claude" = "deny"
"~/.claude.json" = "deny"
"~/.codex/sessions" = "deny"
"~/.config/agent-alignment" = "deny"
"~/.bash_history" = "deny"
"~/.python_history" = "deny"
"~/.node_repl_history" = "deny"
"~/.vault-token" = "deny"
"~/.mozilla" = "deny"
"~/.config/chromium" = "deny"
"~/.config/google-chrome" = "deny"
"~/.copilot" = "deny"
"~/.gemini" = "deny"
# Local control sockets: WSL interop starts Windows programs, the systemd user
# bus starts unsandboxed ones, and Docker is root on the host.
"/run/WSL" = "deny"
"/run/user" = "deny"
"/run/docker.sock" = "deny"

[permissions.workstation.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/.envrc" = "deny"
"**/*.tfvars" = "deny"
"**/*.tfvars.json" = "deny"
"**/*.tfstate" = "deny"
"**/*.tfstate.backup" = "deny"
"**/*.age" = "deny"
"**/*.kdbx" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/id_rsa" = "deny"
"**/id_ed25519" = "deny"
"**/id_ecdsa" = "deny"

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[shell_environment_policy.filters]
# Name any client token your shell exports, for example:
# "EXAMPLE_API_KEY" = "exclude"

# Sandboxed commands have no network with the settings above. To allow fetches
# to named hosts only, pick one of the two documented ways. Neither is applied
# by this snippet. Validate enforcement on each supported client version.
#
# Option A, user config: the built-in proxy with a domain allowlist.
# [features]
# network_proxy = true
#
# [permissions.workstation.network]
# enabled = true
# Domain rules restrict destinations, not HTTP methods or browser actions.
# allow_local_binding = false
# enable_socks5 = false
# enable_socks5_udp = false
#
# [permissions.workstation.network.domains]
# Use the reviewed domain list in ../.claude/managed-settings.example.json
# (sandbox.network.allowedDomains) for both tools; do not maintain another list.
# "developers.openai.com" = "allow"  # syntax example
#
# Option B, admin-enforced /etc/codex/requirements.toml, which a session cannot
# loosen because the rules forbid sudo:
# [experimental_network]
# enabled = true
# managed_allowed_domains_only = true
#
# [experimental_network.domains]
# "pypi.org" = "allow"
# "github.com" = "allow"
